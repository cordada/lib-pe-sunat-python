# GitHub Dependabot Configuration
#
# Dependabot can maintain your repository’s dependencies automatically.
#
# Documentation:
# - https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
# - https://docs.github.com/en/code-security/concepts/supply-chain-security/about-dependabot-version-updates
# - https://github.com/dependabot/dependabot-core/#readme

version: 2

updates:
  - package-ecosystem: pip
    directory: /
    ignore:
      - dependency-name: "black"
        update-types: ["version-update:semver-major"]
    groups:
      python-development:
        dependency-type: development
        exclude-patterns:
          - "pip"
          - "pip-tools"
          - "setuptools"
          - "types-*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions-production:
        dependency-type: production
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps):"
    labels:
      - dependencies
    open-pull-requests-limit: 5
